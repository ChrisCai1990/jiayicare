server {
    listen 443 ssl;
    http2 on;
    server_name www.jiaycare.com;

    ssl_certificate     /etc/nginx/ssl/jiaycare.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/jiaycare.com.key;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/jiaycare.com.fullchain.cer;
    resolver 223.5.5.5 223.6.6.6 valid=300s;
    resolver_timeout 5s;

    root /var/www/jiayicare-static/corporate;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
