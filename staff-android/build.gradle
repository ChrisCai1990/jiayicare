buildscript {
    repositories { maven { url 'https://developer.huawei.com/repo/' }; google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
        if (file('app/agconnect-services.json').exists()) classpath 'com.huawei.agconnect:agcp:1.9.6.300'
    }
}
