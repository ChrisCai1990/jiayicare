# Bootstrap-only configuration used before the first staging TLS certificate exists.
# Replace this file with jiayicare-staging.conf immediately after certificate issuance.
server {
    listen 80;
    server_name staging.jiaycare.com staging-jinyisen.jiaycare.com staging-admin.jiaycare.com staging-staff.jiaycare.com staging-api.jiaycare.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 404;
    }
}
