# 启用前置条件：四个 staging 子域名已解析到本机，且证书已签发到下列路径。
server {
    listen 80;
    server_name staging.jiaycare.com staging-admin.jiaycare.com staging-staff.jiaycare.com staging-api.jiaycare.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-api.jiaycare.com;
    ssl_certificate /etc/letsencrypt/live/jiayicare-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiayicare-staging/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.jiaycare.com;
    ssl_certificate /etc/letsencrypt/live/jiayicare-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiayicare-staging/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/messages/stream/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        client_max_body_size 110m;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-admin.jiaycare.com;
    ssl_certificate /etc/letsencrypt/live/jiayicare-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiayicare-staging/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        client_max_body_size 110m;
    }
    location / {
        proxy_pass http://127.0.0.1:5175;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-staff.jiaycare.com;
    ssl_certificate /etc/letsencrypt/live/jiayicare-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiayicare-staging/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        client_max_body_size 110m;
    }
    location / {
        proxy_pass http://127.0.0.1:5174;
    }
}
